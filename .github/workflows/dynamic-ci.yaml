name: Dynamic CI
run-name: Dynamic CI for ${{ github.head_ref || github.ref_name }}
on: pull_request

permissions:
  contents: read

# Gives the browser extension's e2e real "Skipped by dynamic-ci" checks to
# render, and one to force. Neither sample job is required, so the engine is
# free to skip them; the queue's required check stays "run tests on PR".
jobs:
  dynamic-ci:
    name: Dynamic CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Per-job outputs are set by the action at runtime, so they are re-exported
    # here by name.
    outputs:
      sample-a: ${{ steps.ci-filter.outputs.sample-a }}
      sample-b: ${{ steps.ci-filter.outputs.sample-b }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dynamic CI
        id: ci-filter
        uses: trunk-io/dynamic-ci@main
        with:
          token: ${{ secrets.TRUNK_STAGING_ORG_API_TOKEN }}
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io

  sample-a:
    name: Dynamic CI sample A
    needs: dynamic-ci
    if: ${{ !cancelled() && needs.dynamic-ci.outputs.sample-a != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "sample A ran"

  sample-b:
    name: Dynamic CI sample B
    needs: dynamic-ci
    if: ${{ !cancelled() && needs.dynamic-ci.outputs.sample-b != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "sample B ran"
