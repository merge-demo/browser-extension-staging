name: PR Testing
run-name: PR Checks for ${{ github.ref_name }}
on:
  pull_request: {}
  push:
    branches:
      - trunk-merge/**

# Concurrency group so we can detect duplicate runs (pull_request + push for same branch).
# We do not cancel in progress - the duplicate run will skip so MQ doesn't see a failure.
concurrency:
  group: pr-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: run tests on ${{ github.event_name == 'pull_request' && 'PR' || 'push' }}
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # On push: if this branch has an open PR, skip so the pull_request trigger handles it (avoid duplicate work).
      # On pull_request: always run (we are the PR run).
      - name: Check for duplicate run
        id: duplicate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('skip_duplicate', 'false');
              return;
            }
            const branch = process.env.BRANCH_NAME;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            core.setOutput('skip_duplicate', pulls.length > 0 ? 'true' : 'false');
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f  # v1.13
        if: steps.duplicate.outputs.skip_duplicate != 'true'
        with:
          repository: trunk-io/mergequeue-tool
          latest: true
          # release-downloader >=1.13 changed the default of `fileName` from "*"
          # to empty (download no assets). Set it explicitly so the mq release
          # assets are downloaded, not just the source tarball.
          fileName: "*"
          tarBall: true
          preRelease: false
          extract: true

      - name: Make mq executable
        if: steps.duplicate.outputs.skip_duplicate != 'true'
        run: chmod +x ./mq

      - name: Determine is_merge
        id: check_is_merge
        if: steps.duplicate.outputs.skip_duplicate != 'true'
        run: |
          if [[ ${GITHUB_EVENT_NAME} == "push" && (${GITHUB_REF_NAME} == trunk-merge/* || ${GITHUB_REF_NAME} == trunk-merge-beta/*) || "${{ github.event.pull_request.title }}" == trunk-merge/*  ]]; then
            echo "on_merge=true" >> $GITHUB_OUTPUT
          else
          echo "on_merge=false" >> $GITHUB_OUTPUT
          fi

      # Fast-pass any PR whose changed files are entirely within extension/.
      - name: Check for extension-only fast-pass
        id: fast_pass
        if: steps.duplicate.outputs.skip_duplicate != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [[ -n "$changed" ]] && ! grep -qv '^extension/' <<< "$changed"; then
            echo "fast_pass=true" >> $GITHUB_OUTPUT
          else
            echo "fast_pass=false" >> $GITHUB_OUTPUT
          fi

      # Browser-extension flaky-test e2e: when a PR commits synthetic JUnit
      # bundles under flaky/, upload each file as its own bundle so the Trunk
      # extension's PR test-results panel has data to render. Normal PRs (no
      # flaky/ files) are unaffected.
      - name: Upload flaky-test e2e bundles 
        if: steps.duplicate.outputs.skip_duplicate != 'true' && github.event_name == 'pull_request'
        env:
          TRUNK_PUBLIC_API_ADDRESS: https://api.trunk-staging.io
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_STAGING_ORG_API_TOKEN }}
        run: |
          shopt -s nullglob
          bundles=(flaky/*.xml)
          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "No flaky/*.xml files in this PR; skipping synthetic bundle upload."
            exit 0
          fi
          curl -fsSL --retry 3 -o trunk-analytics-cli.tar.gz \
            https://github.com/trunk-io/analytics-cli/releases/latest/download/trunk-analytics-cli-x86_64-unknown-linux.tar.gz
          tar -xzf trunk-analytics-cli.tar.gz
          for f in "${bundles[@]}"; do
            echo "Uploading $f as its own bundle"
            ./trunk-analytics-cli upload \
              --junit-paths "$f" \
              --org-url-slug merge-demo \
              --token "$TRUNK_API_TOKEN"
          done

      - name: run tests
        id: test
        # only actually run the test if we're on the merge branch
        # so we can simulate delay and flakiness. PRs whose changes are
        # entirely under extension/ fast-pass without invoking the test simulator.
        if:
          steps.duplicate.outputs.skip_duplicate != 'true' && steps.check_is_merge.outputs.on_merge
          == 'true' && steps.fast_pass.outputs.fast_pass != 'true'
        run: |
          ./mq test-sim
        env:
          IS_MERGE: ${{ steps.check_is_merge.outputs.on_merge }}
